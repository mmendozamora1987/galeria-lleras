<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Galería Llerista</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.35)
    ),
    url("fondo-institucional.jpg");

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

}

#contenedor{

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

}

#slide{

    max-width:94vw;
    max-height:92vh;

    object-fit:contain;

    border-radius:18px;

    box-shadow:
    0 18px 45px rgba(0,0,0,.45);

    transition:
    opacity 1s ease,
    transform 1s ease;

    opacity:1;

}

video#slide{

    background:black;

}

</style>

</head>

<body>

<div id="contenedor"></div>

<script>

let archivos=[];
let actual=0;

const DURACION_IMAGEN=8000;

async function cargar(){

    const r=await fetch(
        "fotos.json?nocache="+Date.now()
    );

    archivos=await r.json();

    if(!archivos.length) return;

    mostrar(0);

}

function esVideo(ruta){

    return ruta.toLowerCase().endsWith(".mp4");

}

function mostrar(indice){

    actual=indice;

    const ruta=archivos[indice];

    const cont=document.getElementById("contenedor");

    cont.innerHTML="";

    let elemento;

    if(esVideo(ruta)){

        elemento=document.createElement("video");

        elemento.src=ruta;

        elemento.id="slide";

        elemento.autoplay=true;

        elemento.muted=true;

        elemento.playsInline=true;

        elemento.controls=false;

        elemento.onended=siguiente;

    }

    else{

        elemento=document.createElement("img");

        elemento.src=ruta;

        elemento.id="slide";

        setTimeout(siguiente,DURACION_IMAGEN);

    }

    cont.appendChild(elemento);

}

function siguiente(){

    actual++;

    if(actual>=archivos.length){

        actual=0;

    }

    mostrar(actual);

}

cargar();

</script>

</body>
</html>
